<!-- Pin the ambient background's phase to wall-clock time rather than to page
     load, so the colour carries on from where it was instead of restarting on
     navigation, and starts somewhere different on each fresh visit. 360s is
     the exact cycle length -- one there-and-back of the 180s sweep -- so the
     phase is continuous rather than merely close. Runs before first paint;
     without JS the animation simply starts from zero as it used to.
     (The ribbon's fluid gets the same continuity from reading Date.now()
     directly; see the script in _includes/sidebar.html.) -->
<script>
  document.documentElement.style.setProperty(
    '--ambient-phase', '-' + (Date.now() / 1000 % 360).toFixed(2) + 's');
</script>
