<!-- Pin the long-running animations to wall-clock time rather than to page
     load. Because every page reads the same clock, the background colour and
     the ribbon's fluid both carry on from where they were instead of
     restarting on navigation; and because the clock is never the same twice,
     each fresh visit starts somewhere different. The moduli are the exact
     cycle lengths (360s = one there-and-back of the 180s sweep; 1800s is the
     common period every blob duration divides into), so the phase is
     continuous rather than merely close. Runs before first paint; without JS
     the animations simply start from zero as they used to. -->
<script>
  var s = Date.now() / 1000, r = document.documentElement.style;
  r.setProperty('--ambient-phase', '-' + (s % 360).toFixed(2) + 's');
  r.setProperty('--ooze-phase', '-' + (s % 1800).toFixed(2) + 's');
</script>
